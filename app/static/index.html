<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Workflow Lab</title>
<style>
:root{--green:#16834a;--ink:#18251d;--muted:#607067;--line:#dbe5dd}*{box-sizing:border-box}body{margin:0;background:#f4f8f4;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:28px 16px}header,section{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}h1{font-size:clamp(28px,4vw,40px);margin:8px 0}.tag{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.12em;text-transform:uppercase}p{color:var(--muted)}textarea{width:100%;min-height:90px;border:1px solid #cbd8ce;border-radius:10px;padding:12px;font:inherit}button{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 15px;margin:8px 8px 0 0;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#eaf4ed;color:#175d36}.status{white-space:pre-wrap;color:var(--muted);margin-top:12px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.item pre{white-space:pre-wrap;overflow-wrap:anywhere}.pill{font-size:12px;font-weight:700;background:#eaf4ed;padding:3px 7px;border-radius:99px}
</style></head><body><main>
<header><div class="tag">Agentic workflow demo · no paid API</div><h1>Agent Workflow Lab</h1><p>Plan a task, inspect its approved tools, approve multi-step workflows, and review a trace. Tools are deterministic mock handlers; email is draft-only.</p><label for="goal"><strong>What should the agent do?</strong></label><textarea id="goal">Look up the maintenance restart checklist and draft an email summary</textarea><button id="plan">Create plan</button><div id="status" class="status" role="status"></div></header>
<section><h2>Plan and execution</h2><div id="workflow">Create a plan to begin.</div><div id="actions"></div></section>
<section><h2>Available tools</h2><div id="tools">Loading tools…</div></section>
<script>
let current=null;const $=id=>document.getElementById(id);
async function call(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
function render(w){current=w;$('workflow').innerHTML='';const summary=document.createElement('div');summary.className='item';summary.textContent='Status: '+w.status+' · Approval required: '+w.requires_approval+' · Approved: '+w.approved;$('workflow').append(summary);
w.steps.forEach((s,i)=>{const el=document.createElement('div');el.className='item';const title=document.createElement('strong');title.textContent=(i+1)+'. '+s.tool+' — '+s.status;const pre=document.createElement('pre');pre.textContent=JSON.stringify(s.result||s.input||s.error,null,2);el.append(title,pre);$('workflow').append(el)});
const trace=document.createElement('div');trace.className='item';trace.innerHTML='<strong>Execution trace</strong>';const pre=document.createElement('pre');pre.textContent=JSON.stringify(w.trace,null,2);trace.append(pre);$('workflow').append(trace);
$('actions').innerHTML='';if(w.status==='awaiting_approval'){const b=document.createElement('button');b.textContent='Approve plan';b.onclick=async()=>{try{render(await call('/workflows/'+w.id+'/approve','POST'));$('status').textContent='Approval recorded.'}catch(e){$('status').textContent=e.message}};$('actions').append(b)}
if(['planned','failed'].includes(w.status)){const b=document.createElement('button');b.textContent='Execute workflow';b.onclick=async()=>{try{render(await call('/workflows/'+w.id+'/execute','POST'));$('status').textContent='Execution finished.'}catch(e){$('status').textContent=e.message}};$('actions').append(b)}}
$('plan').onclick=async()=>{try{$('status').textContent='Planning…';render(await call('/workflows/plan','POST',{goal:$('goal').value}));$('status').textContent='Plan ready. Inspect each step before executing.'}catch(e){$('status').textContent=e.message}};
call('/tools').then(d=>{$('tools').innerHTML='';d.tools.forEach(t=>{const div=document.createElement('div');div.className='item';div.textContent=t.name+' · '+t.risk+' — '+t.description;$('tools').append(div)})}).catch(e=>$('tools').textContent=e.message);
</script></main></body></html>
